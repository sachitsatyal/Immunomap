[project]
name = "immunomap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sachitsatyal", email = "18736789+sachitsatyal@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
immunomap = "immunomap:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
train = [
    "torch>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["immunomap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=immunomap --cov-report=term-missing"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.uv]
default-groups = ["dev", "train"]
