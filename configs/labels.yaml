# Three-level label tree. Each source label maps to the deepest node it supports.
version: 1

lineage: [T cell, NK/ILC, B cell, Myeloid, Progenitor, Other]

coarse:            # coarse label: its lineage
  CD4 T: T cell
  CD8 T: T cell
  Treg: T cell
  gamma-delta T: T cell
  MAIT: T cell
  double-negative T: T cell
  NK: NK/ILC
  ILC: NK/ILC
  B: B cell
  Plasmablast: B cell
  CD14 monocyte: Myeloid
  CD16 monocyte: Myeloid
  cDC: Myeloid
  pDC: Myeloid
  HSPC: Progenitor
  Platelet: Other
  Erythrocyte: Other

fine:              # fine label: its coarse parent (coarse labels without children are their own fine label)
  CD4 naive T: CD4 T
  CD4 central memory T: CD4 T
  CD4 effector memory T: CD4 T
  CD8 naive T: CD8 T
  CD8 central memory T: CD8 T
  CD8 effector memory T: CD8 T
  Treg naive: Treg
  Treg memory: Treg
  NK CD56dim: NK
  NK CD56bright: NK
  B naive: B
  B memory: B
  cDC1: cDC
  cDC2: cDC

